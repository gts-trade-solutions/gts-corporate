# nginx in front of the Next.js server for gtstradesolutions.com.
# Installed to /etc/nginx/sites-available/ by deploy/server-setup.sh.
#
# The canonical address is https://gtstradesolutions.com. It must match
# NEXT_PUBLIC_SITE_URL. Plain HTTP and the www host both redirect to it.
#
# The listen lines deliberately carry no http2: on nginx 1.24 that flag applies
# to every site sharing port 443, and this server hosts several others.

server {
    listen 80;
    listen [::]:80;
    server_name gtstradesolutions.com www.gtstradesolutions.com;

    # Let's Encrypt renewals (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://gtstradesolutions.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.gtstradesolutions.com;

    ssl_certificate     /etc/letsencrypt/live/gtstradesolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gtstradesolutions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://gtstradesolutions.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gtstradesolutions.com;

    ssl_certificate     /etc/letsencrypt/live/gtstradesolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gtstradesolutions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Enquiry attachments are capped at 10 MB in total by the app, admin
    # photographs at 3 MB. This leaves room for the form fields around them.
    client_max_body_size 12m;

    location / {
        # PM2 app "gts-corporate" (deploy/deploy.sh).
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # The rate limiters key on the first X-Forwarded-For entry. Replace the
        # header with the connecting address rather than appending to it, so a
        # visitor cannot pick their own key by sending the header themselves.
        proxy_set_header X-Forwarded-For $remote_addr;
        # The assistant streams its answer; it sends X-Accel-Buffering: no.
        proxy_read_timeout 120s;
    }
}
